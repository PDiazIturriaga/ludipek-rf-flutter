name: ludipek_wms_rf
description: Terminal Operativo RF - LUDIPEK WMS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  excel: ^4.0.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icono_app.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true

 # Borra los nombres de archivos específicos y déjalo así:
  assets:
    - assets/